name: Build PS4 PKG
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip
      - name: Get OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/oo" && cd "$HOME/oo"
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*linux*' \
            || gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain
          for f in *.tar.gz; do [ -f "$f" ] && tar xzf "$f"; done || true
          for f in *.zip; do [ -f "$f" ] && unzip -q "$f"; done || true
          TC=$(dirname "$(find "$HOME/oo" -name link.x | head -1)")
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "Toolchain: $TC"; ls "$TC"
      - name: Build
        run: chmod +x build.sh && ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PS4Downloader-pkg
          path: out/*.pkg
