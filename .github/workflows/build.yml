name: Build PS4 PKG
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip

      - name: Get OpenOrbis toolchain (v0.5.4, LLVM 18)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=OpenOrbis/OpenOrbis-PS4-Toolchain
          mkdir -p "$HOME/oo" "$HOME/oo-samples"
          cd "$HOME/oo"
          gh release download v0.5.4 --repo "$REPO" --pattern 'toolchain-llvm-18.tar.gz'
          tar xzf toolchain-llvm-18.tar.gz
          LX=$(find "$HOME/oo" -name link.x | head -1)
          [ -n "$LX" ] || { echo "::error::link.x not found"; find "$HOME/oo" -maxdepth 3 | head -50; exit 1; }
          TC=$(dirname "$LX")
          chmod -R +x "$TC/bin/linux" || true
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "Toolchain: $TC"; ls "$TC"

          # right.sprx is required in sce_sys/about; take it from the toolchain or the samples
          cd "$HOME/oo-samples"
          gh release download v0.5.3 --repo "$REPO" --pattern 'samples-pkg-llvm-18.zip' || true
          [ -f samples-pkg-llvm-18.zip ] && unzip -q samples-pkg-llvm-18.zip || true
          SPRX=$(find "$HOME/oo" "$HOME/oo-samples" -name right.sprx | head -1)
          if [ -n "$SPRX" ]; then
            mkdir -p "$GITHUB_WORKSPACE/sce_sys/about"
            cp "$SPRX" "$GITHUB_WORKSPACE/sce_sys/about/right.sprx"
            echo "Using $SPRX"
          else
            echo "::error::right.sprx not found"; exit 1
          fi
          echo "=== tools in bin/linux ==="; ls "$TC/bin/linux"

      - name: Build
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: chmod +x build.sh && ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PS4Downloader-pkg
          path: out/*.pkg
