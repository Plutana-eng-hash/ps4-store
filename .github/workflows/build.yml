name: Build PS4 PKG
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip curl jq

      - name: Get OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=OpenOrbis/OpenOrbis-PS4-Toolchain
          mkdir -p "$HOME/oo" && cd "$HOME/oo"

          echo "=== Recent releases and their assets ==="
          gh api "repos/$REPO/releases?per_page=10" \
            --jq '.[] | .tag_name + ": " + ([.assets[].name] | join(", "))'

          ARCHIVE='\.(zip|tar\.gz|tgz)$'
          # 1) prefer an asset with "linux" in the name (case-insensitive)
          URL=$(gh api "repos/$REPO/releases?per_page=10" --jq \
            "[.[].assets[] | select(.name|test(\"linux\";\"i\")) | select(.name|test(\"$ARCHIVE\";\"i\"))][0].browser_download_url // empty")
          # 2) else any zip/tar.gz that isn't an installer
          if [ -z "$URL" ]; then
            URL=$(gh api "repos/$REPO/releases?per_page=10" --jq \
              "[.[].assets[] | select(.name|test(\"$ARCHIVE\";\"i\")) | select(.name|test(\"win|mac|exe|pkg\";\"i\")|not)][0].browser_download_url // empty")
          fi
          if [ -z "$URL" ]; then
            echo "::error::No usable toolchain archive found in recent releases. See the asset list above."
            exit 1
          fi
          echo "Downloading: $URL"
          curl -fsSL -o toolchain.archive "$URL"
          case "$URL" in
            *.zip) unzip -q toolchain.archive ;;
            *)     tar xzf toolchain.archive ;;
          esac

          LX=$(find "$HOME/oo" -name link.x | head -1)
          [ -n "$LX" ] || { echo "::error::link.x not found after extracting"; find "$HOME/oo" -maxdepth 3 | head -50; exit 1; }
          TC=$(dirname "$LX")
          chmod -R +x "$TC/bin/linux" || true
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "Toolchain: $TC"; ls "$TC"

      - name: Build
        run: chmod +x build.sh && ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PS4Downloader-pkg
          path: out/*.pkg
